server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # O React Router cuida das rotas: qualquer caminho cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
