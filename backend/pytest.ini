[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # Aviso interno do plugin do anyio em versões novas do pytest (não é do nosso código).
    ignore:.*CallSpec2.*:pytest.PytestRemovedIn10Warning
    # Aviso interno do pydantic vindo das dependências do fastapi-mcp (não é do nosso código).
    ignore:The `__get_pydantic_core_schema__` method:DeprecationWarning
